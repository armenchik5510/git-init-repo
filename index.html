     <!--
     
Создание и клонирование

• git init — создаёт новый локальный репозиторий в текущей папке.
• git clone <URL> — копирует удалённый репозиторий с GitHub на компьютер.

Фиксация изменений

• git status — показывает изменённые, добавленные и неотслеживаемые файлы.
• git add <файл> или git add . — добавляет файлы в область подготовки (индекс) перед коммитом.
• git commit -m "сообщение" — сохраняет снимок изменений с комментарием.
• git log — выводит историю коммитов.

Работа с ветками

• git branch — показывает список веток.
• git switch -c <имя_ветки> — создаёт новую ветку и переключается на неё.
• git switch <имя_ветки> — переключается на указанную ветку.
• git merge <имя_ветки> — объединяет изменения из выбранной ветки в текущую.
• git branch -d <имя_ветки> — удаляет локальную ветку после слияния.

Синхронизация с GitHub

• git remote add origin <URL> — связывает локальную папку с репозиторием на GitHub.
• git push origin <ветка> — отправляет локальные коммиты на GitHub.
• git pull — скачивает обновления с GitHub и сливает их с текущей веткой.
• git fetch — загружает изменения с GitHub без автоматического слияния.

Отмена и откат изменений

• git restore <файл> — отменяет несохранённые изменения в рабочем файле.
• git stash — временно прячет незакоммиченные правки, а git stash pop возвращает их.
• git revert <хеш_коммита> — создаёт новый коммит, отменяющий указанный коммит.
